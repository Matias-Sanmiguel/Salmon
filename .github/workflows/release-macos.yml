name: macOS release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release-macos.yml"
      - "scripts/macos/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    outputs:
      package: ${{ steps.package.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Install declared minimum Rust version with macOS targets
        run: >-
          rustup toolchain install 1.88.0 --profile minimal
          --target aarch64-apple-darwin --target x86_64-apple-darwin
      - name: Check tag matches crate version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/salmon-cli/Cargo.toml | head -n 1)"
          test "${GITHUB_REF_NAME}" = "v${version}"
      - name: Build universal archive
        id: package
        run: |
          archive="$(./scripts/macos/build-universal.sh dist | tail -n 1)"
          echo "name=$(basename "$archive" .tar.gz)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  smoke-test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/macos
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.package }}
          path: download
      - name: Verify checksum and extract
        working-directory: download
        run: |
          shasum -a 256 -c "${{ needs.build.outputs.package }}.tar.gz.sha256"
          tar -xzf "${{ needs.build.outputs.package }}.tar.gz"
      - name: Smoke test the downloaded binary
        run: |
          package="download/${{ needs.build.outputs.package }}"
          ./scripts/macos/smoke-test.sh "$package/salmon" "$package/examples"

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.package }}
          path: dist
      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag --title "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          fi
