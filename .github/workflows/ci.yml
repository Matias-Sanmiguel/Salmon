name: Rust checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install declared minimum Rust version
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +1.88.0 fmt --all -- --check
      - name: Lint
        run: cargo +1.88.0 clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo +1.88.0 test --workspace --locked
      - name: Build documentation
        run: cargo +1.88.0 doc --workspace --no-deps --locked
